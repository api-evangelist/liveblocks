apis:
- aid: liveblocks:rest-api
  name: Liveblocks REST API
  description: >-
    Server-side REST API for managing rooms, room access, storage, active users, broadcast events, comments
    and threads, notifications, Yjs documents, and version history. Authenticated with a secret key via
    Bearer authorization.
  humanURL: https://liveblocks.io/docs/api-reference/rest-api-endpoints
