  /rooms/{roomId}/attachments/{attachmentId}:
    get:
      summary: Get attachment
      description: Gets an attachment's metadata and a presigned download URL. The URL expires after 1 hour.
      tags:
      - Comments
      operationId: get-attachment
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the attachment
          example: at_abc123
      responses:
        '200':
          description: Success. Returns the attachment metadata with a presigned download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentWithUrl'
              examples:
                Success:
                  value:
                    type: attachment
                    id: at_abc123
                    mimeType: image/png
                    name: screenshot.png
                    size: 12345
                    url: https://example.com/at_abc123?X-Amz-Expires=3600&X-Amz-Signature=...
                    expiresAt: '2026-03-16T14:00:00.000Z'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: Attachment not found
  /rooms/{roomId}/attachments/{attachmentId}/upload/{name}:
    put:
      summary: Upload attachment
      description: Uploads a file's bytes and returns a draft comment attachment. Pass the returned attachment ID in the comment's attachment IDs when creating or editing a comment. For large files, use the multipart upload operations instead.
      tags:
      - Comments
      operationId: upload-attachment
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^at_[A-Za-z0-9_-]{21}$
          description: ID for the attachment
          example: at_abc123456789012345678
      - name: name
        in: path
        required: true
        schema:
          type: string
          description: Name of the file
          example: screenshot.png
      - name: userId
        in: query
        required: true
        schema:
          type: string
          description: ID of the user uploading the attachment
          example: alice
      - name: fileSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Expected file size in bytes
          example: 12345
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Success. Returns the uploaded draft attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentAttachment'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: An attachment with this ID already exists.
        '413':
          description: The attachment exceeds the project's per-file upload limit.
        '422':
          $ref: '#/components/responses/422'
  /rooms/{roomId}/attachments/{attachmentId}/multipart/{name}:
    post:
      summary: Create attachment multipart upload
      description: Starts a multipart upload for a draft comment attachment.
