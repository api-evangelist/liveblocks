          type: string
        organizationId:
          type: string
        readAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        notifiedAt:
          type: string
          format: date-time
      required:
      - kind
      - id
      - roomId
      - threadId
      - notifiedAt
      - readAt
      example:
        kind: thread
        id: in_abc123
        roomId: my-room-id
        organizationId: org_123456789
        threadId: th_abc123
        notifiedAt: '2024-01-15T10:30:00.000Z'
        readAt: null
    Comment:
      type: object
      title: Comment
      properties:
        type:
          const: comment
        threadId:
          type: string
        roomId:
          type: string
        id:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        body:
          $ref: '#/components/schemas/CommentBody'
        metadata:
          $ref: '#/components/schemas/CommentMetadata'
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/CommentReaction'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/CommentAttachment'
      required:
      - type
      - threadId
      - roomId
      - id
      - userId
      - createdAt
      - metadata
      - reactions
      - attachments
      examples:
      - type: comment
        threadId: thread-id
        roomId: room-id
        id: comment-id
        userId: string
        createdAt: '2019-08-24T14:15:22Z'
        editedAt: '2019-08-24T14:15:22Z'
        deletedAt: '2019-08-24T14:15:22Z'
        body: {}
        metadata: {}
        reactions: []
        attachments: []
    CommentReaction:
      type: object
      title: CommentReaction
      properties:
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        emoji:
          type: string
      required:
      - userId
      - emoji
      - createdAt
      additionalProperties: false
      examples:
      - emoji: 👨‍👩‍👧
        createdAt: '2022-07-13T14:32:50.697Z'
        userId: alice
    EditThreadMetadataRequestBody:
      title: EditThreadMetadataRequestBody
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        userId:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - metadata
      - userId
      examples:
      - metadata:
          color: blue
        userId: alice
        createdAt: '2023-07-13T14:32:50.697Z'
  responses:
    409-comment:
      description: Comment already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_ALREADY_EXISTS:
              value:
                error: RESOURCE_ALREADY_EXISTS
                message: Comment already exists
        application/xml:
          schema:
            type: object
            properties: {}
    404-comment-reaction:
      description: Comment not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_NOT_FOUND:
              value:
                error: RESOURCE_NOT_FOUND
                message: Comment reaction not found
        application/xml:
          schema:
            type: object
            properties: {}
    '422':
      description: Unprocessable entity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UNPROCESSABLE_ENTITY:
              value:
                error: UNPROCESSABLE_ENTITY
                message: 'Missing key: ''defaultAccesses''.'
                suggestion: Please ensure the data follows the correct format.
                docs: ''
    '401':
      description: Missing or wrong credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            WRONG_KEY_USED:
              value:
                error: WRONG_KEY_USED
                message: Public key instead of the secret key.
                suggestion: 'Please use your secret key instead of the public key, the secret key is available in the dashboard: https://liveblocks.io/dashboard/apikeys.'
                docs: ''
            MISSING_SECRET_KEY:
              value:
                error: MISSING_SECRET_KEY
                message: Missing secret key in authentication header
                suggestion: 'Please use a secret key, the secret key is available in the dashboard: https://liveblocks.io/dashboard/apikeys'
                docs: ''
            MISSING_MANAGEMENT_API_ACCESS_TOKEN:
              value:
                error: MISSING_MANAGEMENT_API_ACCESS_TOKEN
                message: Missing management api access token in authentication header
                suggestion: Please provide a management api access token in the authentication header
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
            INVALID_MANAGEMENT_API_ACCESS_TOKEN:
              value:
                error: INVALID_MANAGEMENT_API_ACCESS_TOKEN
                message: Invalid management api access token
                suggestion: Please provide a valid management api access token in the authentication header
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
            REVOKED_MANAGEMENT_API_ACCESS_TOKEN:
              value:
                error: REVOKED_MANAGEMENT_API_ACCESS_TOKEN
                message: Revoked management api access token
                suggestion: Please provide an active management api access token in the authentication header
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
            EXPIRED_MANAGEMENT_API_ACCESS_TOKEN:
              value:
                error: EXPIRED_MANAGEMENT_API_ACCESS_TOKEN
                message: Expired management api access token
                suggestion: Please provide a not expired management api access token in the authentication header
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    404-comment:
      description: Comment not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_NOT_FOUND:
              value:
                error: RESOURCE_NOT_FOUND
                message: Comment not found
        application/xml:
          schema:
            type: object
            properties: {}
    404-thread:
      description: Thread not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_NOT_FOUND:
              value:
                error: RESOURCE_NOT_FOUND
                message: Thread not found
        application/xml:
          schema:
            type: object
            properties: {}
    409-comment-reaction:
      description: Reaction already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_ALREADY_EXISTS:
              value:
                error: RESOURCE_ALREADY_EXISTS
                message: Reaction already exists
        application/xml:
          schema:
            type: object
            properties: {}
    '403':
      description: Unauthorized access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            INVALID_SECRET_KEY:
              value:
                error: INVALID_SECRET_KEY
                message: Invalid secret key.
                suggestion: 'Please use a valid secret key, the secret key is available in the dashboard: https://liveblocks.io/dashboard/apikeys.'
                docs: ''
            INVALID_PUBLIC_KEY:
              value:
                error: INVALID_PUBLIC_KEY
                message: Invalid public key
                suggestion: 'Please use a valid public key, the public key is available in the dashboard: https://liveblocks.io/dashboard/apikeys'
                docs: ''
            UNAUTHORIZED_ROOM_ACCESS:
              value:
                error: UNAUTHORIZED_ROOM_ACCESS
                message: The user does not have permission to access the room.
                suggestion: Please add the user’s ID or one of the user’s group IDs to the room first.
                docs: ''
            INVALID_MANAGEMENT_API_ACCESS_TOKEN_SCOPE:
              value:
                error: INVALID_MANAGEMENT_API_ACCESS_TOKEN_SCOPE
                message: Invalid management api access token scope
                suggestion: 'Please provide a management api access token with required scope: ''read:all''.'
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
            FEATURE_NOT_ENABLED:
              value:
                error: FEATURE_NOT_ENABLED
                message: The "Management API" feature is not enabled for this account.
                suggestion: If you want access to this feature, please contact us at support@liveblocks.io
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
            PUBLIC_KEY_NOT_ENABLED:
              value:
                error: PUBLIC_KEY_NOT_ENABLED
                message: Public key not enabled
                suggestion: Please enable the public key for the project
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    '404':
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ROOM_NOT_FOUND:
              value:
                error: ROOM_NOT_FOUND
                message: Room not found.
                suggestion: 'Please use a valid room ID, room IDs are available in the dashboard: https://liveblocks.io/dashboard/rooms.'
                docs: ''
            WEBHOOK_NOT_FOUND:
              value:
                error: WEBHOOK_NOT_FOUND
                message: Webhook "ep_xxx" not found.
                suggestion: 'Please use a valid webhook ID, webhook IDs are available in the dashboard: https://liveblocks.io/dashboard/webhooks'
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
            NOT_EXISTING_MANAGEMENT_API_ACCESS_TOKEN:
              value:
                error: NOT_EXISTING_MANAGEMENT_API_ACCESS_TOKEN
                message: Not existing management api access token
                suggestion: Please provide an existing management api access token in the authentication header
                docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    409-thread:
      description: Thread already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RESOURCE_ALREADY_EXISTS:
              value:
                error: RESOURCE_ALREADY_EXISTS
                message: Thread already exists
        application/xml:
          schema:
            type: object
            properties: {}
