          description: The multipart upload belongs to a different project or room.
  /rooms/{roomId}/threads/{threadId}/comments/{commentId}/metadata:
    post:
      summary: Edit comment metadata
      tags:
      - Comments
      description: 'This endpoint edits the metadata of a comment. The metadata is a JSON object that can be used to store any information you want about the comment, in `string`, `number`, or `boolean` form. Set a property to `null` to remove it. Corresponds to `liveblocks.editCommentMetadata`.


        `metadata` supports maximum 50 entries. Key length has a limit of 40 characters maximum. Value length has a limit of 4000 characters maximum for strings.'
      operationId: edit-comment-metadata
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the comment
          example: cm_abc123
      responses:
        '200':
          description: Success. Returns the updated metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentMetadata'
              examples:
                Success:
                  value:
                    tag: important
                    reviewed: false
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-comment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCommentMetadataRequestBody'
            examples:
              example:
                value:
                  metadata:
                    tag: null
                    reviewed: true
                  userId: alice
                  updatedAt: '2023-07-13T14:32:50.697Z'
  /rooms/{roomId}/threads/{threadId}/inbox-notifications:
    parameters:
    - schema:
        type: string
        example: my-room-id
      name: roomId
      in: path
      required: true
    - schema:
        type: string
        example: th_abc123
      name: threadId
      in: path
      required: true
    get:
      summary: Get thread inbox notifications
      tags:
      - Comments
      description: This endpoint returns the inbox notifications associated with a specific thread. Because this endpoint is not user-scoped, each notification includes a `userId` field identifying which user the notification belongs to. Only thread-kind notifications are returned.
      operationId: get-thread-inbox-notifications
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '200':
          description: Success. Returns the inbox notifications for the thread.
          content:
            application/json:
              schema:
                type: object
                title: Response
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/InboxNotificationThreadData'
                      - type: object
                        properties:
                          userId:
                            type: string
                            description: The user ID this notification belongs to.
                        required:
                        - userId
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
components:
  schemas:
    ThreadMetadata:
      type: object
      title: ThreadMetadata
      additionalProperties:
        oneOf:
        - type: string
          maxLength: 4000
        - type: number
        - type: boolean
      required: []
      examples:
      - color: blue
        age: 25
      description: Custom metadata attached to a thread. Supports maximum 50 entries. Key length has a limit of 40 characters maximum. Value length has a limit of 4000 characters maximum for strings.
      maxProperties: 50
      propertyNames:
        maxLength: 40
    Error:
      title: Error
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Message explaining the error
        suggestion:
          type: string
          description: A suggestion on how to fix the error
        docs:
          type: string
          description: A link to the documentation
    GetThreadSubscriptionsResponse:
      type: object
      title: GetThreadSubscriptionsResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserSubscription'
      required:
      - data
      additionalProperties: false
      example:
        data:
        - kind: thread
          subjectId: th_abc123
          createdAt: '2022-07-13T14:32:50.697Z'
          userId: alice
    AttachmentMultipartPart:
      type: object
      title: AttachmentMultipartPart
      properties:
        partNumber:
          type: integer
          minimum: 1
        etag:
          type: string
      required:
      - partNumber
      - etag
      additionalProperties: false
    CommentAttachment:
      type: object
      title: CommentAttachment
      properties:
        type:
          type: string
          const: attachment
        id:
          type: string
        mimeType:
          type: string
        name:
          type: string
        size:
          type: integer
      required:
      - type
      - id
      - mimeType
      - name
      - size
      additionalProperties: false
      example:
        type: attachment
        id: at_abc123
        mimeType: image/png
        name: screenshot.png
        size: 12345
    AddCommentReactionRequestBody:
      type: object
      title: AddCommentReactionRequestBody
      properties:
