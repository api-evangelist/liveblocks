openapi: 3.2.0
info:
  title: Liveblocks Comments API
  version: '2.0'
  description: 'The Liveblocks REST API lets you read and modify rooms, threads, notifications, users, permissions, and schemas programmatically. Authenticate requests with a secret key using the `Authorization: Bearer` header.'
servers:
- url: https://api.liveblocks.io/v2
tags:
- name: Comments
paths:
  /rooms/{roomId}/threads:
    get:
      summary: Get room threads
      description: This endpoint returns the threads in the requested room. Corresponds to `liveblocks.getThreads`.
      tags:
      - Comments
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - schema:
          type: string
          description: Query to filter threads. You can filter by `metadata`, `resolved`, and `visibility`, for example, `metadata["status"]:"open" AND metadata["color"]:"red" AND resolved:true AND visibility:"private"`. Learn more about [filtering threads with query language](https://liveblocks.io/docs/guides/how-to-filter-threads-using-query-language).
          example: metadata["color"]:"blue"
        in: query
        name: query
      operationId: get-threads
      responses:
        '200':
          description: Success. Returns list of threads in a room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThreadsResponse'
              examples:
                Success:
                  value:
                    data:
                    - type: thread
                      id: thread-id
                      roomId: room-id
                      comments:
                      - type: comment
                        threadId: thread-id
                        roomId: room-id
                        id: comment-id
                        userId: string
                        createdAt: '2019-08-24T14:15:22Z'
                        editedAt: '2019-08-24T14:15:22Z'
                        deletedAt: '2019-08-24T14:15:22Z'
                        body: {}
                        metadata: {}
                        reactions: []
                        attachments: []
                      createdAt: '2019-08-24T14:15:22Z'
                      metadata: {}
                      resolved: false
                      visibility: public
                      updatedAt: '2019-08-24T14:15:22Z'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
    post:
      summary: Create thread
      description: 'This endpoint creates a new thread and the first comment in the thread. Corresponds to `liveblocks.createThread`.


        A comment’s body is an array of paragraphs, each containing child nodes. Here’s an example of how to construct a comment’s body, which can be submitted under `comment.body`.


        ```json

        {

        "version": 1,

        "content": [

        {

        "type": "paragraph",

        "children": [{ "text": "Hello " }, { "text": "world", "bold": true }]

        }

        ]

        }

        ```


        `metadata` supports maximum 50 entries. Key length has a limit of 40 characters maximum. Value length has a limit of 4000 characters maximum for strings.'
      tags:
      - Comments
      operationId: create-thread
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      responses:
        '200':
          description: Success. Returns the created thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
              examples:
                example:
                  value:
                    type: thread
                    id: thread-id
                    roomId: room-id
                    comments:
                    - type: comment
                      threadId: thread-id
                      roomId: room-id
                      id: comment-id
                      userId: alice
                      createdAt: '2022-07-13T14:32:50.697Z'
                      body: {}
                      metadata: {}
                      reactions: []
                      attachments: []
                    createdAt: '2022-07-13T14:32:50.697Z'
                    updatedAt: '2022-07-13T14:32:50.697Z'
                    metadata:
                      color: blue
                    resolved: false
                    visibility: public
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409-thread'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequestBody'
            examples:
              example:
                value:
                  comment:
                    userId: alice
                    createdAt: '2022-07-13T14:32:50.697Z'
                    body:
                      version: 1
                      content: []
                    metadata:
                      tag: important
                      spam: false
                  metadata:
                    color: blue
  /rooms/{roomId}/threads/{threadId}:
    get:
      summary: Get thread
      tags:
      - Comments
      description: This endpoint returns a thread by its ID. Corresponds to `liveblocks.getThread`.
      operationId: get-thread
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '200':
          description: Success. Returns requested thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
              examples:
                Success:
                  value:
                    type: thread
                    id: thread-id
                    roomId: room-id
                    comments:
                    - type: comment
                      threadId: thread-id
                      roomId: room-id
                      id: comment-id
                      userId: string
                      createdAt: '2019-08-24T14:15:22Z'
                      editedAt: '2019-08-24T14:15:22Z'
                      deletedAt: '2019-08-24T14:15:22Z'
                      body: {}
                      metadata: {}
                      reactions: []
                      attachments: []
                    createdAt: '2019-08-24T14:15:22Z'
                    metadata: {}
                    resolved: false
                    visibility: public
                    updatedAt: '2019-08-24T14:15:22Z'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
    delete:
      summary: Delete thread
      tags:
      - Comments
      description: This endpoint deletes a thread by its ID. Corresponds to `liveblocks.deleteThread`.
      operationId: delete-thread
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '204':
          description: Success. The thread has been deleted.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/participants:
    get:
      summary: Get thread participants
      tags:
      - Comments
      deprecated: true
      description: '**Deprecated.** Prefer using thread subscriptions instead.


        This endpoint returns the list of thread participants. It is a list of unique user IDs representing all the thread comment authors and mentioned users in comments. Corresponds to `liveblocks.getThreadParticipants`.'
      operationId: get-thread-participants
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '200':
          description: Success. Returns the thread’s participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThreadParticipantsResponse'
              examples:
                Success:
                  value:
                    participantIds:
                    - user-1
                    - user-2
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/metadata:
    post:
      summary: Edit thread metadata
      tags:
      - Comments
      description: 'This endpoint edits the metadata of a thread. The metadata is a JSON object that can be used to store any information you want about the thread, in `string`, `number`, or `boolean` form. Set a property to `null` to remove it. Corresponds to `liveblocks.editThreadMetadata`.


        `metadata` supports maximum 50 entries. Key length has a limit of 40 characters maximum. Value length has a limit of 4000 characters maximum for strings.'
      operationId: edit-thread-metadata
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '200':
          description: Success. Returns the updated metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMetadata'
              examples:
                Success:
                  value:
                    color: yellow
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditThreadMetadataRequestBody'
            examples:
              example:
                value:
                  metadata:
                    color: yellow
                  userId: alice
                  createdAt: '2023-07-13T14:32:50.697Z'
  /rooms/{roomId}/threads/{threadId}/mark-as-resolved:
    post:
      summary: Mark thread as resolved
      tags:
      - Comments
      description: This endpoint marks a thread as resolved. The request body must include a `userId` to identify who resolved the thread. Returns the updated thread. Corresponds to `liveblocks.markThreadAsResolved`.
      operationId: mark-thread-as-resolved
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkThreadAsResolvedRequestBody'
      responses:
        '200':
          description: Success. Returns the updated thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/mark-as-unresolved:
    post:
      summary: Mark thread as unresolved
      tags:
      - Comments
      description: This endpoint marks a thread as unresolved. The request body must include a `userId` to identify who unresolved the thread. Returns the updated thread. Corresponds to `liveblocks.markThreadAsUnresolved`.
      operationId: mark-thread-as-unresolved
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkThreadAsUnresolvedRequestBody'
      responses:
        '200':
          description: Success. Returns the updated thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/subscribe:
    parameters:
    - schema:
        type: string
        example: my-room-id
      name: roomId
      in: path
      required: true
    - schema:
        type: string
        example: th_abc123
      name: threadId
      in: path
      required: true
    post:
      summary: Subscribe to thread
      tags:
      - Comments
      description: This endpoint subscribes to a thread. Corresponds to `liveblocks.subscribeToThread`.
      operationId: subscribe-to-thread
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToThreadRequestBody'
      responses:
        '200':
          description: Success. Returns the thread subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/unsubscribe:
    parameters:
    - schema:
        type: string
        example: my-room-id
      name: roomId
      in: path
      required: true
    - schema:
        type: string
        example: th_abc123
      name: threadId
      in: path
      required: true
    post:
      summary: Unsubscribe from thread
      tags:
      - Comments
      description: This endpoint unsubscribes from a thread. Corresponds to `liveblocks.unsubscribeFromThread`.
      operationId: unsubscribe-from-thread
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeFromThreadRequestBody'
      responses:
        '200':
          description: Success.
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/subscriptions:
    parameters:
    - schema:
        type: string
        example: my-room-id
      name: roomId
      in: path
      required: true
    - schema:
        type: string
        example: th_abc123
      name: threadId
      in: path
      required: true
    get:
      summary: Get thread subscriptions
      tags:
      - Comments
      description: This endpoint gets the list of subscriptions to a thread. Corresponds to `liveblocks.getThreadSubscriptions`.
      operationId: get-thread-subscriptions
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThreadSubscriptionsResponse'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
  /rooms/{roomId}/threads/{threadId}/comments:
    post:
      summary: Create comment
      description: 'This endpoint creates a new comment, adding it as a reply to a thread. Corresponds to `liveblocks.createComment`.


        A comment’s body is an array of paragraphs, each containing child nodes. Here’s an example of how to construct a comment’s body, which can be submitted under `body`.


        ```json

        {

        "version": 1,

        "content": [

        {

        "type": "paragraph",

        "children": [{ "text": "Hello " }, { "text": "world", "bold": true }]

        }

        ]

        }

        ```


        `metadata` supports maximum 50 entries. Key length has a limit of 40 characters maximum. Value length has a limit of 4000 characters maximum for strings.'
      tags:
      - Comments
      operationId: create-comment
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      responses:
        '200':
          description: Success. Returns the created comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                example:
                  value:
                    type: comment
                    threadId: thread-id
                    roomId: room-id
                    id: comment-id
                    userId: alice
                    createdAt: '2022-07-13T14:32:50.697Z'
                    body: {}
                    metadata: {}
                    reactions: []
                    attachments: []
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
        '409':
          $ref: '#/components/responses/409-comment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequestBody'
            examples:
              example:
                value:
                  userId: alice
                  createdAt: '2022-07-13T14:32:50.697Z'
                  body:
                    version: 1
                    content: []
                  metadata:
                    tag: important
                    spam: false
  /rooms/{roomId}/threads/{threadId}/comments/{commentId}:
    get:
      summary: Get comment
      tags:
      - Comments
      description: This endpoint returns a comment by its ID. Corresponds to `liveblocks.getComment`.
      operationId: get-comment
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the comment
          example: cm_abc123
      responses:
        '200':
          description: Success. Returns the requested comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                Success:
                  value:
                    type: comment
                    threadId: thread-id
                    roomId: room-id
                    id: comment-id
                    userId: alice
                    createdAt: '2019-08-24T14:15:22Z'
                    editedAt: '2019-08-24T14:15:22Z'
                    deletedAt: '2019-08-24T14:15:22Z'
                    body: {}
                    metadata: {}
                    reactions: []
                    attachments: []
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
    post:
      summary: Edit comment
      description: 'This endpoint edits the specified comment. Corresponds to `liveblocks.editComment`.


        A comment’s body is an array of paragraphs, each containing child nodes. Here’s an example of how to construct a comment’s body, which can be submitted under `body`.


        ```json

        {

        "version": 1,

        "content": [

        {

        "type": "paragraph",

        "children": [{ "text": "Hello " }, { "text": "world", "bold": true }]

        }

        ]

        }

        ```'
      tags:
      - Comments
      operationId: edit-comment
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the comment
          example: cm_abc123
      responses:
        '200':
          description: Success. Returns the edited comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                example:
                  value:
                    type: comment
                    threadId: thread-id
                    roomId: room-id
                    id: comment-id
                    userId: alice
                    createdAt: '2023-07-13T14:32:50.697Z'
                    body: {}
                    metadata: {}
                    reactions: []
                    attachments: []
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-thread'
        '409':
          $ref: '#/components/responses/409-comment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCommentRequestBody'
            examples:
              example:
                value:
                  editedAt: '2023-07-13T14:32:50.697Z'
                  body:
                    version: 1
                    content: []
    delete:
      summary: Delete comment
      tags:
      - Comments
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the comment
          example: cm_abc123
      responses:
        '204':
          description: Success. The comment was deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-comment'
      operationId: delete-comment
      description: This endpoint deletes a comment. A deleted comment is no longer accessible from the API or the dashboard and it cannot be restored. Corresponds to `liveblocks.deleteComment`.
  /rooms/{roomId}/threads/{threadId}/comments/{commentId}/add-reaction:
    post:
      summary: Add comment reaction
      description: This endpoint adds a reaction to a comment. Corresponds to `liveblocks.addCommentReaction`.
      tags:
      - Comments
      operationId: add-comment-reaction
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the comment
          example: cm_abc123
      responses:
        '200':
          description: Success. Returns the created reaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReaction'
              examples:
                example:
                  value:
                    emoji: 👨‍👩‍👧
                    createdAt: '2022-07-13T14:32:50.697Z'
                    userId: alice
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-comment'
        '409':
          $ref: '#/components/responses/409-comment-reaction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentReactionRequestBody'
            examples:
              example:
                value:
                  emoji: 👨‍👩‍👧
                  createdAt: '2022-07-13T14:32:50.697Z'
                  userId: alice
  /rooms/{roomId}/threads/{threadId}/comments/{commentId}/remove-reaction:
    post:
      summary: Remove comment reaction
      description: This endpoint removes a comment reaction. A deleted comment reaction is no longer accessible from the API or the dashboard and it cannot be restored. Corresponds to `liveblocks.removeCommentReaction`.
      tags:
      - Comments
      operationId: remove-comment-reaction
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          description: ID of the room
          example: my-room-id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          description: ID of the thread
          example: th_abc123
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          description: ID of the comment
          example: cm_abc123
      responses:
        '204':
          description: Success. The comment reaction was deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404-comment-reaction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCommentReactionRequestBody'
            examples:
              example:
                value:
                  emoji: 👨‍👩‍👧
                  userId: alice
