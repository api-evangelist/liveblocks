openapi: 3.2.0
info:
  title: Liveblocks Management API
  version: '2.0'
  description: 'The Liveblocks REST API lets you read and modify rooms, threads, notifications, users, permissions, and schemas programmatically. Authenticate requests with a secret key using the `Authorization: Bearer` header.'
servers:
- url: https://api.liveblocks.io/v2
tags:
- name: Management
paths:
  /management/projects:
    get:
      summary: List projects
      description: Returns a paginated list of projects. You can filter by exact, case-sensitive project name using the `query` parameter. Project names are not unique, so multiple projects can match. You can limit the number of projects returned per page and use the provided `nextCursor` for pagination. This endpoint requires the `read:all` scope.
      tags:
      - Management
      parameters:
      - schema:
          type: string
          description: A query to filter projects by exact, case-sensitive name.
          example: name:"Frimousse"
        in: query
        name: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: A limit on the number of projects to return. The limit can range between 1 and 100, and defaults to 20.
          example: 20
        in: query
        name: limit
      - schema:
          type: string
          description: A cursor used for pagination. Get the value from the `nextCursor` response of the previous page.
          example: eyJjcmVhdGVkQXQiOjE2NjAwMDA5ODgxMzd9
        in: query
        name: cursor
      responses:
        '200':
          description: Success. Returns the list of projects and the next page cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagementProjectsResponse'
              examples:
                example:
                  value:
                    projects:
                    - id: 683d49ed6b4d1cec5a597b13
                      teamId: team_123
                      type: dev
                      name: Frimousse
                      description: A lightweight, unstyled, and composable emoji picker for React.
                      createdAt: '2024-09-03T12:34:56.000Z'
                      updatedAt: '2024-09-03T12:34:56.000Z'
                      publicKey:
                        activated: true
                        createdAt: '2024-09-03T12:34:56.000Z'
                        value: pk_dev_123
                      secretKey:
                        createdAt: '2024-09-03T12:34:56.000Z'
                        value: sk_dev_123
                      region: earth
                      versionCreationTimeout: false
                    nextCursor: eyJpZCI6IjY4M2Q0OWVkNmI0ZDFjZWM1YTU5N2IxMyIsImNyZWF0ZWRBdCI6MTcyNTI4NzcwMDAwMH0=
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
      operationId: get-management-projects
    post:
      summary: Create project
      description: Creates a new project within your account. This endpoint requires the `write:all` scope. You can specify the project type, name, region, and version creation timeout. Upon success, returns information about the newly created project, including its ID, keys, region, and settings.
      tags:
      - Management
      responses:
        '200':
          description: Success. Returns the created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementProject'
              examples:
                example:
                  value:
                    project:
                      id: 683d49ed6b4d1cec5a597b13
                      teamId: team_123
                      type: dev
                      name: Frimousse
                      createdAt: '2024-09-03T12:34:56.000Z'
                      updatedAt: '2024-09-03T12:34:56.000Z'
                      publicKey:
                        activated: true
                        createdAt: '2024-09-03T12:34:56.000Z'
                        value: pk_dev_123
                      secretKey:
                        createdAt: '2024-09-03T12:34:56.000Z'
                        value: sk_dev_123
                      region: earth
                      versionCreationTimeout: false
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
      operationId: create-management-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagementProjectRequestBody'
            examples:
              example:
                value:
                  name: Frimousse
                  description: A lightweight, unstyled, and composable emoji picker for React.
                  type: dev
                  region: earth
                  versionCreationTimeout: false
  /management/projects/{projectId}:
    get:
      summary: Get project
      description: Returns a single project specified by its ID. This endpoint requires the `read:all` scope. If the project cannot be found, a 404 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. Returns the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementProject'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: get-management-project
    post:
      summary: Update project
      description: 'Updates an existing project specified by its ID. This endpoint allows you to modify project details such as the project name and the version creation timeout. The `versionCreationTimeout` can be set to `false` to disable the timeout or to a number of seconds between 30 and 300. Fields omitted from the request body will not be updated. Requires the `write:all` scope.


        If the project cannot be found, a 404 error response is returned.'
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. Returns the updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementProject'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: update-management-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagementProjectRequestBody'
            examples:
              example:
                value:
                  name: Valleys
                  description: A lightweight TypeScript library for assertion-based runtime data validation.
                  versionCreationTimeout: false
    delete:
      summary: Delete project
      description: Soft deletes the project specified by its ID. This endpoint requires the `write:all` scope. If the project cannot be found, a 404 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. The project was deleted.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: delete-management-project
  /management/projects/{projectId}/api-keys/public/activate:
    post:
      summary: Activate public key
      description: Activates the public API key associated with the specified project. This endpoint requires the `write:all` scope. If the project cannot be found, a 404 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. The public key was activated.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: activate-project-public-api-key
  /management/projects/{projectId}/api-keys/public/deactivate:
    post:
      summary: Deactivate public key
      description: Deactivates the public API key associated with the specified project. This endpoint requires the `write:all` scope. If the project cannot be found, a 404 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. The public key was deactivated.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: deactivate-project-public-api-key
  /management/projects/{projectId}/api-keys/public/roll:
    post:
      summary: Roll public key
      description: 'Rolls (rotates) the public API key associated with the specified project, generating a new key value while deprecating the previous one. The new key becomes immediately active. This endpoint requires the `write:all` scope.


        If the public key is not currently enabled for the project, a 403 error response is returned. If the project cannot be found, a 404 error response is returned. An optional `expirationIn` parameter can be provided in the request body to set when the previous key should expire.'
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. Returns the rolled public key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollProjectPublicApiKeyResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: roll-project-public-api-key
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollProjectPublicApiKeyRequestBody'
            examples:
              example:
                value:
                  expirationIn: 1 hour
  /management/projects/{projectId}/api-keys/secret/roll:
    post:
      summary: Roll secret key
      description: 'Rolls (rotates) the secret API key associated with the specified project, generating a new key value while deprecating the previous one. The new key becomes immediately active. This endpoint requires the `write:all` scope.


        If the project cannot be found, a 404 error response is returned. An optional `expirationIn` parameter can be provided in the request body to set when the previous key should expire.'
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. Returns the rolled secret key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollProjectSecretApiKeyResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: roll-project-secret-api-key
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollProjectSecretApiKeyRequestBody'
            examples:
              example:
                value:
                  expirationIn: 3 days
                  newKeyExpirationIn: 30 days
  /management/projects/{projectId}/webhooks:
    get:
      summary: List webhooks
      description: Returns a paginated list of webhooks for a project. This endpoint requires the `read:all` scope. The response includes an array of webhook objects associated with the specified project, as well as a `nextCursor` property for pagination. Use the `limit` query parameter to specify the maximum number of webhooks to return (1-100, default 20). If the result is paginated, use the `cursor` parameter from the `nextCursor` value in the previous response to fetch subsequent pages. If the project cannot be found, a 404 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: A limit on the number of webhooks to return. The limit can range between 1 and 100, and defaults to 20.
          example: 20
        in: query
        name: limit
      - schema:
          type: string
          description: A cursor used for pagination. Get the value from the `nextCursor` response of the previous page.
          example: eyJjcmVhdGVkQXQiOjE2NjAwMDA5ODgxMzd9
        in: query
        name: cursor
      responses:
        '200':
          description: Success. Returns the list of webhooks and the next page cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagementWebhooksResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: get-management-webhooks
    post:
      summary: Create webhook
      description: Creates a new webhook for a project. This endpoint requires the `write:all` scope. If the project cannot be found, a 404 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      responses:
        '200':
          description: Success. Returns the created webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementWebhook'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: create-management-webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagementWebhookRequestBody'
            examples:
              example:
                value:
                  url: https://example.com/webhooks
                  subscribedEvents:
                  - storageUpdated
                  - userEntered
                  rateLimit: 100
                  additionalHeaders:
                    LB-X-FOO: bar
                  storageUpdatedThrottleSeconds: 10
                  yDocUpdatedThrottleSeconds: 10
  /management/projects/{projectId}/webhooks/{webhookId}:
    get:
      summary: Get webhook
      description: Get one webhook by `webhookId` for a project. Returns webhook settings such as URL, subscribed events, disabled state, throttling, and additional headers. Returns `404` if the project or webhook does not exist. This endpoint requires the `read:all` scope.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementWebhook'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: get-management-webhook
    post:
      summary: Update webhook
      description: Update one webhook by `webhookId` for a project. Send only fields you want to change; omitted fields stay unchanged. Returns `404` if the project or webhook does not exist and `422` for validation errors. This endpoint requires the `write:all` scope.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the updated webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementWebhook'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: update-management-webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagementWebhookRequestBody'
            examples:
              example:
                value:
                  url: https://example.com/webhooks
                  subscribedEvents:
                  - storageUpdated
                  - userEntered
                  rateLimit: 100
                  storageUpdatedThrottleSeconds: 10
                  yDocUpdatedThrottleSeconds: 10
                  disabled: false
    delete:
      summary: Delete webhook
      description: Delete one webhook by `webhookId` for a project. Returns `200` with an empty body on success, or `404` if the project or webhook does not exist. Requires `write:all`.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. The webhook was deleted.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: delete-management-webhook
  /management/projects/{projectId}/webhooks/{webhookId}/secret/roll:
    post:
      summary: Roll webhook secret
      description: Rotate a webhook signing secret and return the new secret. The previous secret remains valid for 24 hours. Returns `404` if the project or webhook does not exist. This endpoint requires the `write:all` scope.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the rotated secret key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateManagementWebhookSecretResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: roll-management-webhook-secret
  /management/projects/{projectId}/webhooks/{webhookId}/additional-headers:
    post:
      summary: Patch webhook headers
      description: Upsert additional headers for a webhook. Provided headers are merged with existing headers, and existing values are overwritten when names match. Returns updated headers, or `404` if the project or webhook does not exist. This endpoint requires the `write:all` scope.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the updated headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertManagementWebhookHeadersResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: upsert-management-webhook-additional-headers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertManagementWebhookHeadersRequestBody'
            examples:
              example:
                value:
                  headers:
                    X-Custom-Header: value
    get:
      summary: Get webhook headers
      description: Get a webhook's additional headers. Returns `404` if the project or webhook does not exist. Requires `read:all`.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManagementWebhookHeadersResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      operationId: get-management-webhook-additional-headers
  /management/projects/{projectId}/webhooks/{webhookId}/delete-additional-headers:
    post:
      summary: Delete webhook headers
      description: Remove selected additional headers from a webhook. Send header names in `headers` field; other headers are unchanged. Returns updated headers, or `404` if the project or webhook does not exist. This endpoint requires the `write:all` scope. At least one header name must be provided; otherwise, a 422 error response is returned.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the updated headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteManagementWebhookHeadersResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: delete-management-webhook-additional-headers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteManagementWebhookHeadersRequestBody'
            examples:
              example:
                value:
                  headers:
                  - X-Custom-Header
                  - X-Another-Header
  /management/projects/{projectId}/webhooks/{webhookId}/recover-failed-messages:
    post:
      summary: Recover failed webhook messages
      description: Requeue failed deliveries for a webhook from the given `since` timestamp. Returns `200` with an empty body when recovery starts, an `404` if the project or webhook does not exist. This endpoint requires the `write:all` scope.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. The recover task was started.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: recover-failed-webhook-messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverManagementWebhookFailedMessagesRequestBody'
            examples:
              example:
                value:
                  since: '2026-01-21T00:00:00.000Z'
  /management/projects/{projectId}/webhooks/{webhookId}/test:
    post:
      summary: Send test webhook
      description: Send a test event to a webhook and return the created message metadata. `subscribedEvent` must be one of the webhook's subscribed events, otherwise the endpoint returns `422`. Returns `404` if the project or webhook does not exist. This endpoint requires the `write:all` scope.
      tags:
      - Management
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: ID of the project
          example: 683d49ed6b4d1cec5a597b13
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          description: ID of the webhook
          example: wh_abc123
      responses:
        '200':
          description: Success. Returns the test message ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestManagementWebhookResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
      operationId: send-test-webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestManagementWebhookRequestBody'
            examples:
              example:
                value:
                  subscribedEvent: storageUpdated
components:
  schemas:
    Error:
      title: Error
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Message explaining the error
        suggestion:
          type: string
          description: A suggestion on how to fix the error
        docs:
          type: string
          description: A link to the documentation
    GetManagementProjectsResponse:
      title: GetManagementProjectsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManagementProject'
        nextCursor:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - data
      - nextCursor
      additionalProperties: false
      example:
        data:
        - id: 683d49ed6b4d1cec5a597b13
          teamId: team_123
          type: dev
          name: My Project
          createdAt: '2024-09-03T12:34:56.000Z'
          updatedAt: '2024-09-03T12:34:56.000Z'
          publicKey:
            activated: true
            createdAt: '2024-09-03T12:34:56.000Z'
            value: pk_dev_123
          secretKey:
            createdAt: '2024-09-03T12:34:56.000Z'
            value: sk_dev_123
          region: earth
          versionCreationTimeout: false
        nextCursor: null
