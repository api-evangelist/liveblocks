      title: DeleteManagementWebhookHeadersRequestBody
      type: object
      properties:
        headers:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - headers
      additionalProperties: false
      example:
        headers:
        - X-Custom-Header
        - X-Another-Header
    ManagementWebhook:
      title: ManagementWebhook
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        disabled:
          type: boolean
        rateLimit:
          type: integer
          minimum: 1
          maximum: 65534
        subscribedEvents:
          type: array
          items:
            $ref: '#/components/schemas/ManagementWebhookEvent'
        secret:
          oneOf:
          - $ref: '#/components/schemas/ManagementWebhookSecret'
          - type: 'null'
        additionalHeaders:
          $ref: '#/components/schemas/ManagementWebhookAdditionalHeaders'
        storageUpdatedThrottleSeconds:
          type: integer
        yDocUpdatedThrottleSeconds:
          type: integer
      required:
      - id
      - createdAt
      - updatedAt
      - url
      - disabled
      - subscribedEvents
      - secret
      - storageUpdatedThrottleSeconds
      - yDocUpdatedThrottleSeconds
      additionalProperties: false
      example:
        id: wh_abc123
        createdAt: '2024-09-03T12:34:56.000Z'
        updatedAt: '2024-09-03T12:34:56.000Z'
        url: https://example.com/webhooks
        disabled: false
        subscribedEvents:
        - storageUpdated
        - userEntered
        secret:
          value: whsec_abc123
        storageUpdatedThrottleSeconds: 10
        yDocUpdatedThrottleSeconds: 10
    CreateManagementWebhookRequestBody:
      title: CreateManagementWebhookRequestBody
      type: object
      properties:
        url:
          type: string
          format: uri
        subscribedEvents:
          type: array
          items:
            $ref: '#/components/schemas/ManagementWebhookEvent'
        rateLimit:
          type: integer
          minimum: 1
          maximum: 65534
        additionalHeaders:
          type: object
          additionalProperties:
            type: string
        storageUpdatedThrottleSeconds:
          type: integer
        yDocUpdatedThrottleSeconds:
          type: integer
      required:
      - url
      - subscribedEvents
      example:
        url: https://example.com/webhooks
        subscribedEvents:
        - storageUpdated
        - userEntered
        rateLimit: 100
        storageUpdatedThrottleSeconds: 10
        yDocUpdatedThrottleSeconds: 10
    ManagementProjectRegion:
      title: ManagementProjectRegion
      type: string
      description: The region where the project's data is stored and processed.
      enum:
      - earth
      - eu
      - fedramp
      example: earth
    ManagementWebhookEvent:
      title: ManagementWebhookEvent
      type: string
      enum:
      - storageUpdated
      - userEntered
      - userLeft
      - roomCreated
      - roomDeleted
      - commentCreated
      - commentEdited
      - commentDeleted
      - commentReactionAdded
      - commentReactionRemoved
      - commentMetadataUpdated
      - threadMetadataUpdated
      - threadCreated
      - threadDeleted
      - ydocUpdated
